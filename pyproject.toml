[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-complaint-triage"
version = "0.1.0"
description = "NLP system that routes bank customer complaints, ranks them by escalation risk, detects emerging issues and summarizes them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "holidays>=0.60",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
    "langdetect>=1.0.9",
    "pyspark>=3.5",
    "requests>=2.32",
]
ml = [
    "mlflow>=2.16",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "shap>=0.46",
    "torch>=2.4",
    "transformers>=4.44",
]
llm = [
    "ollama>=0.3",
]
pipeline = [
    "prefect>=3.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dashboard = [
    "plotly>=5.24",
    "streamlit>=1.38",
]
dev = [
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
all = [
    "smart-complaint-triage[data,ml,llm,pipeline,api,dashboard,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_complaint_triage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
