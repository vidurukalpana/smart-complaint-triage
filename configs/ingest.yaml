base_url: https://files.consumerfinance.gov/f/documents/
files:
  - CCDB_Export_18_May_2026.zip
  - CCDB_Export_19_June_2026.zip
  - CCDB_Export_20_July_2026.zip
  - CCDB_Export_21_August_2026.zip

raw_dir: data/raw/narratives_archive
manifest_file: data/raw/narratives_archive/download_manifest.json
delete_downloads: true

parquet_dir: data/processed/complaints_raw.parquet
report_file: data/processed/ingest_report.json
duckdb_table: complaints_raw

spark:
  master: local[*]
  driver_memory: 4g

date_format: yyyy-MM-dd

# CFPB CSV header: column name
columns:
  Complaint ID: complaint_id
  Date received: date_received
  Product: product
  Sub-product: sub_product
  Issue: issue
  Sub-issue: sub_issue
  Consumer complaint narrative: narrative
  Company: company
  State: state
  ZIP code: zip_code
  Tags: tags
  Submitted via: submitted_via
  Date sent to company: date_sent_to_company
  Company response to consumer: company_response
  Timely response?: timely_response
  Company public response: company_public_response

date_columns: [date_received, date_sent_to_company]
