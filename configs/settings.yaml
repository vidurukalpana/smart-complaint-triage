# Project settings: paths, data window, splits and leakage rules.
# All date ranges are inclusive and use the CFPB "date received" field.

random_seed: 42

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  duckdb_file: data/complaints.duckdb
  models_dir: models
  reports_dir: reports
  mlruns_dir: mlruns

data_window:
  start: 2026-05-15
  end: 2026-08-14

splits:
  # Team routing: uses the full data window.
  routing:
    train:      {start: 2026-05-15, end: 2026-07-12}
    validation: {start: 2026-07-13, end: 2026-07-26}
    test:       {start: 2026-07-27, end: 2026-08-14}

  # Escalation risk: complaints received after label_cutoff may not have a
  # final company response yet, so their labels are not reliable.
  escalation:
    label_cutoff: 2026-07-29
    train:      {start: 2026-05-15, end: 2026-07-05}
    validation: {start: 2026-07-06, end: 2026-07-15}
    test:       {start: 2026-07-16, end: 2026-07-29}

# CFPB fields that are only known after the company responds.
# They must never be used as model inputs (target leakage).
forbidden_features:
  - company_response
  - timely_response
  - company_public_response
  - date_sent_to_company
